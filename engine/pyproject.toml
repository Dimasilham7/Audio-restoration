[project]
name = "audiorestorer-engine"
version = "0.1.0"
description = "Local AI/DSP audio restoration engine for AudioRestorer AI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "AudioRestorer AI" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "pedalboard>=0.9.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pyinstaller>=6.0",
  "librosa>=0.10",
]
eval = [
  "librosa>=0.10",
]

[project.scripts]
audiorestorer-engine = "audiorestorer_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiorestorer_engine"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
